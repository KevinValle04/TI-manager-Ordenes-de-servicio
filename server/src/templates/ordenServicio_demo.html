<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo Orden de Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body{background:#f6f7fb;padding:12px}
      .card{max-width:720px;margin:12px auto;padding:12px;border-radius:8px;background:#fff}
      .photos img{width:120px;height:90px;object-fit:cover;margin-right:8px;border-radius:6px}
      canvas{border:1px solid #ddd;border-radius:6px;width:100%;height:160px}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text-center mb-2">
        <img src="/templates/img/top.png" alt="top" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px" />
        <img src="/templates/img/logo.png" alt="logo" style="height:48px;object-fit:contain" />
      </div>
      <div class="mb-3"><h4>Orden de Servicio - Demo</h4></div>
      <div class="mb-3">
        <label class="form-label">Tipo de servicio</label>
        <div class="row g-2">
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Computo" id="tipo-1"><label class="form-check-label" for="tipo-1">Computo</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Sonido" id="tipo-2"><label class="form-check-label" for="tipo-2">Sonido</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Conectividad" id="tipo-3"><label class="form-check-label" for="tipo-3">Conectividad</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Telefonia" id="tipo-4"><label class="form-check-label" for="tipo-4">Telefonia</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Impresora" id="tipo-5"><label class="form-check-label" for="tipo-5">Impresora</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Video" id="tipo-6"><label class="form-check-label" for="tipo-6">Video</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="CCTV" id="tipo-7"><label class="form-check-label" for="tipo-7">CCTV</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Deteccion de incendios" id="tipo-8"><label class="form-check-label" for="tipo-8">Detección de incendios</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Control de acceso" id="tipo-9"><label class="form-check-label" for="tipo-9">Control de acceso</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Cerco electrificado" id="tipo-10"><label class="form-check-label" for="tipo-10">Cerco electrificado</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Electrico" id="tipo-11"><label class="form-check-label" for="tipo-11">Eléctrico</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Alarma" id="tipo-12"><label class="form-check-label" for="tipo-12">Alarma</label></div></div>
          <div class="col-6"><div class="form-check"><input class="form-check-input service-type" type="checkbox" value="Cotizacion" id="tipo-13"><label class="form-check-label" for="tipo-13">Cotización</label></div></div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Datos del cliente</label>
        <div class="row g-2">
          <div class="col-12"><input class="form-control" id="numeroOrdenCliente" placeholder="No. orden cliente" /></div>
          <div class="col-12 col-md-6"><input class="form-control" id="fecha" type="date" /></div>
          <div class="col-12 col-md-6"><input class="form-control" id="cliente" placeholder="Cliente" /></div>
          <div class="col-12"><input class="form-control" id="direccion" placeholder="Dirección" /></div>
          <div class="col-12 col-md-6"><input class="form-control" id="email" type="email" placeholder="E-mail" /></div>
          <div class="col-12 col-md-6"><input class="form-control" id="sucursal" placeholder="Sucursal" /></div>
          <div class="col-12 col-md-6"><input class="form-control" id="telefono" type="tel" placeholder="Teléfono" /></div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Actividades</label>
        <textarea class="form-control" id="actividades" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Solución</label>
        <textarea class="form-control" id="solucion" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Presupuesto</label>
        <input class="form-control" id="presupuesto" />
      </div>

      <div class="mb-3">
        <label class="form-label">Fotos</label>
        <input type="file" id="photos" accept="image/*" multiple capture="environment" />
        <div id="preview" class="photos mt-2"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Firma</label>
        <canvas id="sig" width="600" height="160"></canvas>
        <div class="mt-2"><button id="clear" class="btn btn-sm btn-outline-secondary">Limpiar</button></div>
      </div>

      <div class="d-grid"><button id="save" class="btn btn-primary">Guardar demo</button></div>
    </div>

    <div class="text-center mt-3">
      <img src="/templates/img/bottom-2.png" alt="footer" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px" />
    </div>

    <script>
      const photosInput = document.getElementById('photos');
      const preview = document.getElementById('preview');
      photosInput.addEventListener('change', e => {
        preview.innerHTML = '';
        Array.from(e.target.files).forEach(f => {
          const r = new FileReader(); r.onload = () => {
            const img = document.createElement('img'); img.src = r.result; preview.appendChild(img);
          }; r.readAsDataURL(f);
        });
      });

      // simple signature
      const canvas = document.getElementById('sig'); const ctx = canvas.getContext('2d'); let drawing=false;
      function pos(e){const r=canvas.getBoundingClientRect();return {x: (e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}};
      canvas.addEventListener('mousedown', e=>{drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);});
      canvas.addEventListener('mousemove', e=>{if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();});
      window.addEventListener('mouseup', ()=>drawing=false);
      canvas.addEventListener('touchstart', e=>{drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();});
      canvas.addEventListener('touchmove', e=>{if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault();});
      window.addEventListener('touchend', ()=>drawing=false);
      document.getElementById('clear').addEventListener('click', ()=>{ctx.clearRect(0,0,canvas.width,canvas.height)});

      document.getElementById('save').addEventListener('click', ()=>{
        const payload = {
          tipos: Array.from(document.querySelectorAll('.service-type:checked')).map(input => input.value),
          numeroOrdenCliente: document.getElementById('numeroOrdenCliente').value,
          fecha: document.getElementById('fecha').value,
          cliente: document.getElementById('cliente').value,
          direccion: document.getElementById('direccion').value,
          email: document.getElementById('email').value,
          sucursal: document.getElementById('sucursal').value,
          telefono: document.getElementById('telefono').value,
          actividades: document.getElementById('actividades').value,
          solucion: document.getElementById('solucion').value,
          presupuesto: document.getElementById('presupuesto').value,
          photos: [],
          signature: canvas.toDataURL('image/png')
        };
        alert('Guardado demo local. Revisa la consola.');
        console.log('Demo payload:', payload);
      });
    </script>
  </body>
</html>
